# ---------------------------------------------------------------------------
# Morning Brief — source list
#
# EDITORIAL BALANCE IS INTENTIONAL.
# This list aims for gender balance + worldview diversity:
#   - builders alongside critics
#   - optimists alongside skeptics
#   - practitioners alongside researchers
# When editing: adding 5 male VC voices and dropping a critic is a regression.
# Hold the balance.
#
# Categories (used to route items into editorial sections, not 1:1):
#   builders        — engineering/practice voices, the plumbing
#   research        — papers, labs, internals
#   id_craft        — instructional design as a craft (not vendors)
#   org_design      — workforce / org / talent restructuring
#   criticism       — epistemic counterweight
#   newsletter      — digests
#   tech_writing    — documentation, info architecture
# ---------------------------------------------------------------------------

