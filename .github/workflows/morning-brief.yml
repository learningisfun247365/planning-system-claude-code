name: Morning Brief

on:
  schedule:
    # 11:00 UTC daily (~6am ET, ~7am EDT). Adjust as needed.
    - cron: "0 11 * * *"
  workflow_dispatch:

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: briefing/requirements.txt

      - name: Install dependencies
        run: pip install -r briefing/requirements.txt

      - name: Run scanner
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python briefing/scan.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ briefing/seen.json
          if git diff --quiet --staged; then
            echo "No changes to commit"
          else
            git commit -m "morning brief $(date -u +%Y-%m-%d)"
            git push
          fi
